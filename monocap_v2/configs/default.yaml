pipeline:
  default_video_field: video_sync
  stop_on_stage_error: true

camera:
  mode: assumed_static
  model: pinhole
  focal_scale: 1.2
  distortion:
    enabled: false

backends:
  pose2d: none
  pose3d: metrabs
  contacts: heuristic

metrabs:
  model_type: metrabs_eff2l_y4
  model_path: /home/denik/.keras/models/metrabs_eff2l_y4
  skeleton: smpl_24
  max_detections: 1
  suppress_implausible_poses: false
  max_frames: null
  save_pose2d: true

rtmw3d:
  python: /home/denik/miniconda3/envs/gaitlab/bin/python
  config_path: models/rtmw3d/rtmw3d-l_8xb64_cocktail14-384x288.py
  checkpoint_path: models/rtmw3d/rtmw3d-l_8xb64_cocktail14-384x288-794dbc78_20240626.pth
  metainfo_from_file: external/datasets_config/h3wb.py
  video_field: video_sync
  output_dir_name: rtmw3d_work
  device: cuda:0
  stride: 1
  refine_pass: true
  amp: false
  max_frames: null
  print_every: 50
  export_trc: false
  clear_cache_on_force: true

representations:
  internal_units: m
  allow_joints_only: true
  allow_smpl: true

markers:
  marker_set: null
  time_window:
    mode: sync_overlap_for_wham
    min_frames: 2
  placement_qc:
    enabled: true
    groups:
      - lower_limb
    max_joint_distance_m: 0.20
    min_ankle_to_foot_marker_m: 0.03
    max_ankle_to_foot_marker_m: 0.40
    max_marker_jump_m: 0.20

optimization:
  refinement_profile: null
  refinement_profiles:
    joints_static_chain_contact_v1:
      label: Joints static scale + kinematic chain + contact locking v1
      version: 1
      description: >
        Backend-neutral joints-only refinement profile. Applies subject/static
        lower-limb bone-length retargeting, kinematic-chain temporal smoothing,
        and contact-aware foot locking. It does not use mocap/OpenSim/Level A
        ground truth in the objective or target selection.
      representation: joints
      mocap_used_in_objective: false
      stage_order:
        - subject_scale
        - kinematic_chain
        - contact_foot_locking
      optimization:
        subject_scale:
          enabled: true
          mode: static_bone
          static_trial: auto
          static_trial_priority:
            - static2
            - static1
            - static3
          static_pose3d_path: null
          min_scale: 0.75
          max_scale: 1.35
          retarget_blend: 1.0
        kinematic_chain:
          enabled: true
          method: moving_average
          window_frames: 9
          direction_window_frames: 9
          root_window_frames: 9
          smooth_roots: true
          direction_blend: 1.0
          output_blend: 1.0
          max_joint_displacement_m: 0.20
          savgol_polyorder: 2
        contact_foot_locking:
          enabled: true
          mode: root_translation
          feet: toes
          contact_threshold: 0.85
          min_segment_frames: 3
          lock_vertical: false
          blend: 1.0
          max_correction_m: 0.20
          smooth_correction_window_frames: 3
        joints_only:
          enabled: false
    wham_global_contact_v1:
      label: WHAM SMPL-consistent global contact locking v1
      version: 1
      description: >
        WHAM/SMPL-safe refinement profile. Applies contact-aware per-frame
        global/root translation only, updating joints, SMPL vertices, and SMPL
        translation together so the hybrid artifact remains internally
        consistent. It does not change SMPL pose, shape, or local joint
        geometry, and it does not use mocap/OpenSim/Level A ground truth.
      representation: hybrid
      mocap_used_in_objective: false
      stage_order:
        - contact_foot_locking
      optimization:
        contact_foot_locking:
          enabled: true
          mode: root_translation
          feet: toes_and_heels
          contact_threshold: 0.65
          min_segment_frames: 3
          lock_vertical: false
          blend: 1.0
          max_correction_m: 0.20
          smooth_correction_window_frames: 3
        joints_only:
          enabled: false
    wham_smpl_root_refine_v1:
      label: WHAM SMPL root-parameter refinement v1
      version: 1
      description: >
        WHAM/SMPL-safe root refinement profile. Optimizes only SMPL global
        orientation and camera-local translation while keeping body pose,
        shape, frame selection, markers, and all mocap/OpenSim/Level A ground
        truth out of the objective.
      representation: hybrid
      mocap_used_in_objective: false
      stage_order:
        - wham_smpl_root_refinement
      optimization:
        wham_smpl_root_refinement:
          enabled: true
          python: /home/denik/miniconda3/envs/monocap-wham/bin/python
          device: auto
          max_iterations: 80
          learning_rate: 0.03
          contact_threshold: 0.65
          min_segment_frames: 3
          feet: toes_and_heels
          reconstruction_error_warning_m: 0.02
          max_translation_delta_m: 0.35
          max_orientation_delta_deg: 15.0
          optimize_body_pose: false
          max_body_pose_delta_deg: 8.0
          allow_passthrough_on_missing_runtime: false
          weights:
            translation_prior: 20.0
            orientation_prior: 5.0
            translation_smoothness: 2.0
            orientation_smoothness: 0.5
            body_pose_prior: 0.0
            body_pose_smoothness: 0.0
            contact_velocity: 0.5
            contact_position: 20.0
            flat_floor: 5.0
        joints_only:
          enabled: false
    wham_smpl_root_pose_refine_v1:
      label: WHAM SMPL root + body-pose refinement v1
      version: 1
      description: >
        WHAM/SMPL experimental pose refinement profile. Optimizes SMPL global
        orientation, camera-local translation, and body pose while keeping SMPL
        shape, frame selection, markers, and all mocap/OpenSim/Level A ground
        truth out of the objective. This is diagnostic and more flexible than
        the root-only WHAM profile.
      representation: hybrid
      mocap_used_in_objective: false
      diagnostic: true
      stage_order:
        - wham_smpl_root_refinement
      optimization:
        wham_smpl_root_refinement:
          enabled: true
          python: /home/denik/miniconda3/envs/monocap-wham/bin/python
          device: auto
          max_iterations: 100
          learning_rate: 0.015
          contact_threshold: 0.65
          min_segment_frames: 3
          feet: toes_and_heels
          reconstruction_error_warning_m: 0.02
          max_translation_delta_m: 0.35
          max_orientation_delta_deg: 15.0
          optimize_body_pose: true
          max_body_pose_delta_deg: 8.0
          allow_passthrough_on_missing_runtime: false
          weights:
            translation_prior: 20.0
            orientation_prior: 5.0
            translation_smoothness: 2.0
            orientation_smoothness: 0.5
            body_pose_prior: 15.0
            body_pose_smoothness: 0.5
            contact_velocity: 0.75
            contact_position: 25.0
            flat_floor: 5.0
        joints_only:
          enabled: false
  camera_time_refinement:
    enabled: false
    confidence_threshold: 0.25
    min_depth_m: 0.1
    time_search:
      enabled: true
      min_offset_s: -0.25
      max_offset_s: 0.25
      step_s: 0.02
    camera_delta:
      enabled: true
      max_rotation_deg: 8.0
      max_translation_m: 0.25
      max_nfev: 40
      robust_loss: soft_l1
      f_scale: 0.05
      reprojection_weight: 1.0
      rotation_prior_weight: 0.2
      translation_prior_weight: 0.5
      depth_penalty_weight: 2.0
  subject_scale:
    enabled: false
    mode: height_global
    static_trial: auto
    static_pose3d_path: null
    min_scale: 0.75
    max_scale: 1.35
    retarget_blend: 1.0
    global_segments:
      - left_thigh
      - right_thigh
      - left_shank
      - right_shank
    target_ratios:
      pelvis_width: 0.191
      thigh: 0.245
      shank: 0.246
      foot: 0.152
  temporal_smoothing:
    enabled: false
    method: moving_average
    window_frames: 7
    passes: 1
    smooth_root: true
    preserve_bones: true
    bone_projection_iterations: 2
    bone_preservation_blend: 1.0
    max_joint_displacement_m: 0.15
    savgol_polyorder: 2
  reprojection_consistency:
    enabled: false
    blend: 0.5
    confidence_threshold: 0.25
    min_depth_m: 0.1
    preserve_bones: true
    bone_projection_iterations: 2
    bone_preservation_blend: 1.0
    max_joint_displacement_m: 0.20
  pose_prior:
    enabled: false
    limit_set: lower_limb_conservative
    blend: 1.0
    passes: 1
    max_joint_displacement_m: 0.20
  kinematic_chain:
    enabled: false
    method: moving_average
    window_frames: 9
    direction_window_frames: 9
    root_window_frames: 9
    smooth_roots: true
    direction_blend: 1.0
    output_blend: 1.0
    max_joint_displacement_m: 0.20
    savgol_polyorder: 2
  contact_foot_locking:
    enabled: false
    mode: root_translation
    feet: toes
    contact_threshold: 0.85
    min_segment_frames: 3
    lock_vertical: false
    blend: 1.0
    max_correction_m: 0.20
    smooth_correction_window_frames: 3
  wham_smpl_root_refinement:
    enabled: false
    python: /home/denik/miniconda3/envs/monocap-wham/bin/python
    device: auto
    max_iterations: 80
    learning_rate: 0.03
    contact_threshold: 0.65
    min_segment_frames: 3
    feet: toes_and_heels
    reconstruction_error_warning_m: 0.02
    max_translation_delta_m: 0.35
    max_orientation_delta_deg: 15.0
    optimize_body_pose: false
    max_body_pose_delta_deg: 8.0
    allow_passthrough_on_missing_runtime: false
    weights:
      translation_prior: 20.0
      orientation_prior: 5.0
      translation_smoothness: 2.0
      orientation_smoothness: 0.5
      body_pose_prior: 0.0
      body_pose_smoothness: 0.0
      contact_velocity: 0.5
      contact_position: 20.0
      flat_floor: 5.0
  joints_only:
    enabled: true
    max_nfev: 30
    robust_loss: soft_l1
    f_scale: 0.05
    contact_threshold: 0.85
    min_contact_segment_frames: 3
    mocap_axis: "-y,x,z"
    primary_improvement_epsilon_m: 0.0
    weights:
      fidelity: 30.0
      bone: 80.0
      reprojection: 10.0
      smoothness: 1.0
      contact_velocity: 1.0
      contact_position: 2.0
      flat_floor: 0.5

opensim:
  enabled: false
  require_smpl_markers: true

kinetics:
  enabled: false

qc:
